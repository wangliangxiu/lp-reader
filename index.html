he story of the merchant as I was drinking the last drop of my water supply."},{"p":"\"Ah,\" I said to the little prince, \"these memories of yours are very charming; but I have not yet succeeded in repairing my plane; I have nothing more to drink; and I, too, should be very happy if I could walk at my leisure toward a spring of fresh water!\""},{"p":"\"My friend the fox--\" the little prince said to me."},{"p":"\"My dear little man, this is no longer a matter that has anything to do with the fox!\""},{"p":"\"Why not?\""},{"p":"\"Because I am about to die of thirst . . .\""},{"p":"He did not follow my reasoning, and he answered me:"},{"p":"\"It is a good thing to have had a friend, even if one is about to die. I, for instance, am very glad to have had a fox as a friend . . .\""},{"p":"\"He has no way of guessing the danger,\" I said to myself. \"He has never been either hungry or thirsty. A little sunshine is all he needs . . .\""},{"p":"But he looked at me steadily, and replied to my thought:"},{"p":"\"I am thirsty, too. Let us look for a well . . .\""},{"p":"I made a gesture of weariness. It is absurd to look for a well, at random, in the immensity of the desert. But nevertheless we started walking."},{"p":"When we had trudged along for several hours, in silence, the darkness fell, and the stars began to come out. Thirst had made me a little feverish, and I looked at them as if I were in a dream. The little prince's last words came reeling back into my memory:"},{"p":"\"Then you are thirsty, too?\" I demanded."},{"p":"But he did not reply to my question. He merely said to me:"},{"p":"\"Water may also be good for the heart . . .\""},{"p":"I did not understand this answer, but I said nothing. I knew very well that it was impossible to cross-examine him."},{"p":"He was tired. He sat down. I sat down beside him. And, after a little silence, he spoke again:"},{"p":"\"The stars are beautiful, because of a flower that cannot be seen.\""},{"p":"I replied, \"Yes, that is so.\" And, without saying anything more, I looked across the ridges of sand that were stretched out before us in the moonlight."},{"p":"\"The desert is beautiful,\" the little prince added."},{"p":"And that was true. I have always loved the desert. One sits down on a desert sand dune, sees nothing, hears nothing. Yet through the silence something throbs, and gleams . . ."},{"p":"\"What makes the desert beautiful,\" said the little prince, \"is that somewhere it hides a well . . .\""},{"p":"I was astonished by a sudden understanding of that mysterious radiation of the sands. When I was a little boy I lived in an old house, and legend told us that a treasure was buried there. To be sure, no one had ever known how to find it; perhaps no one had ever even looked for it. But it cast an enchantment over that house. My home was hiding a secret in the depths of its heart . . ."},{"p":"\"Yes,\" I said to the little prince. \"The house, the stars, the desert--what gives them their beauty is something that is invisible!\""},{"p":"\"I am glad,\" he said, \"that you agree with my fox.\""},{"p":"As the little prince dropped off to sleep, I took him in my arms and set out walking once more. I felt deeply moved, and stirred. It seemed to me that I was carrying a very fragile treasure. It seemed to me, even, that there was nothing more fragile on all Earth. In the moonlight I looked at his pale forehead, his closed eyes, his locks of hair that trembled in the wind, and I said to myself: \"What I see here is nothing but a shell. What is most important is invisible . . .\""},{"p":"As his lips opened slightly with the suspicion of a half-smile, I said to myself, again: \"What moves me so deeply, about this little prince who is sleeping here, is his loyalty to a flower--the image of a rose that shines through his whole being like the flame of a lamp, even when he is asleep . . .\" And I felt him to be more fragile still. I felt the need of protecting him, as if he himself were a flame that might be extinguished by a little puff of wind . . ."},{"p":"And, as I walked on so, I found the well, at daybreak."}]},{"n":25,"items":[{"p":"\"Men,\" said the little prince, \"set out on their way in express trains, but they do not know what they are looking for. Then they rush about, and get excited, and turn round and round . . .\""},{"p":"And he added:"},{"p":"\"It is not worth the trouble . . .\""},{"p":"The well that we had come to was not like the wells of the Sahara. The wells of the Sahara are mere holes dug in the sand. This one was like a well in a village. But there was no village here, and I thought I must be dreaming . . ."},{"p":"\"It is strange,\" I said to the little prince. \"Everything is ready for use: the pulley, the bucket, the rope . . .\""},{"p":"He laughed, touched the rope, and set the pulley to working. And the pulley moaned, like an old weathervane which the wind has long since forgotten."},{"p":"\"Do you hear?\" said the little prince. \"We have wakened the well, and it is singing . . .\""},{"p":"I did not want him to tire himself with the rope."},{"p":"\"Leave it to me,\" I said. \"It is too heavy for you.\""},{"p":"I hoisted the bucket slowly to the edge of the well and set it there--happy, tired as I was, over my achievement. The song of the pulley was still in my ears, and I could see the sunlight shimmer in the still trembling water."},{"p":"\"I am thirsty for this water,\" said the little prince. \"Give me some of it to drink . . .\""},{"p":"And I understood what he had been looking for."},{"p":"I raised the bucket to his lips. He drank, his eyes closed. It was as sweet as some special festival treat. This water was indeed a different thing from ordinary nourishment. Its sweetness was born of the walk under the stars, the song of the pulley, the effort of my arms. It was good for the heart, like a present. When I was a little boy, the lights of the Christmas tree, the music of the Midnight Mass, the tenderness of smiling faces, used to make up, so, the radiance of the gifts I received."},{"p":"\"The men where you live,\" said the little prince, \"raise five thousand roses in the same garden--and they do not find in it what they are looking for.\""},{"p":"\"They do not find it,\" I replied."},{"p":"\"And yet what they are looking for could be found in one single rose, or in a little water.\""},{"p":"\"Yes, that is true,\" I said."},{"p":"And the little prince added:"},{"p":"\"But the eyes are blind. One must look with the heart . . .\""},{"p":"I had drunk the water. I breathed easily. At sunrise the sand is the color of honey. And that honey color was making me happy, too. What brought me, then, this sense of grief?"},{"p":"\"You must keep your promise,\" said the little prince, softly, as he sat down beside me once more."},{"p":"\"What promise?\""},{"p":"\"You know--a muzzle for my sheep . . . I am responsible for this flower . . .\""},{"p":"I took my rough drafts of drawings out of my pocket. The little prince looked them over, and laughed as he said:"},{"p":"\"Your baobabs--they look a little like cabbages.\""},{"p":"\"Oh!\""},{"p":"I had been so proud of my baobabs!"},{"p":"\"Your fox--his ears look a little like horns; and they are too long.\""},{"p":"And he laughed again."},{"p":"\"You are not fair, little prince,\" I said. \"I don't know how to draw anything except boa constrictors from the outside and boa constrictors from the inside.\""},{"p":"\"Oh, that will be all right,\" he said, \"children understand.\""},{"i":"img/38.webp"},{"p":"So then I made a pencil sketch of a muzzle. And as I gave it to him my heart was torn."},{"p":"\"You have plans that I do not know about,\" I said."},{"p":"But he did not answer me. He said to me, instead:"},{"p":"\"You know--my descent to the earth . . . Tomorrow will be its anniversary.\""},{"p":"Then, after a silence, he went on:"},{"p":"\"I came down very near here.\""},{"p":"And he flushed."},{"p":"And once again, without understanding why, I had a queer sense of sorrow. One question, however, occurred to me:"},{"p":"\"Then it was not by chance that on the morning when I first met you--a week ago--you were strolling along like that, all alone, a thousand miles from any inhabited region? You were on the your back to the place where you landed?\""},{"p":"The little prince flushed again."},{"p":"And I added, with some hesitancy:"},{"p":"\"Perhaps it was because of the anniversary?\""},{"p":"The little prince flushed once more. He never answered questions--but when one flushes does that not mean \"Yes\"?"},{"p":"\"Ah,\" I said to him, \"I am a little frightened--\""},{"p":"But he interrupted me."},{"p":"\"Now you must work. You must return to your engine. I will be waiting for you here. Come back tomorrow evening . . .\""},{"p":"But I was not reassured. I remembered the fox. One runs the risk of weeping a little, if one lets himself be tamed . . ."}]},{"n":26,"items":[{"p":"Beside the well there was the ruin of an old stone wall. When I came back from my work, the next evening, I saw from some distance away my little price sitting on top of a wall, with his feet dangling. And I heard him say:"},{"p":"\"Then you don't remember. This is not the exact spot.\""},{"p":"Another voice must have answered him, for he replied to it:"},{"p":"\"Yes, yes! It is the right day, but this is not the place.\""},{"p":"I continued my walk toward the wall. At no time did I see or hear anyone. The little prince, however, replied once again:"},{"p":"\"--Exactly. You will see where my track begins, in the sand. You have nothing to do but wait for me there. I shall be there tonight.\""},{"p":"I was only twenty meters from the wall, and I still saw nothing."},{"p":"After a silence the little prince spoke again:"},{"p":"\"You have good poison? You are sure that it will not make me suffer too long?\""},{"p":"I stopped in my tracks, my heart torn asunder; but still I did not understand."},{"p":"\"Now go away,\" said the little prince. \"I want to get down from the wall.\""},{"p":"I dropped my eyes, then, to the foot of the wall--and I leaped into the air. There before me, facing the little prince, was one of those yellow snakes that take just thirty seconds to bring your life to an end. Even as I was digging into my pocked to get out my revolver I made a running step back. But, at the noise I made, the snake let himself flow easily across the sand like the dying spray of a fountain, and, in no apparent hurry, disappeared, with a light metallic sound, among the stones."},{"p":"I reached the wall just in time to catch my little man in my arms; his face was white as snow."},{"p":"\"What does this mean?\" I demanded. \"Why are you talking with snakes?\""},{"p":"I had loosened the golden muffler that he always wore. I had moistened his temples, and had given him some water to drink. And now I did not dare ask him any more questions. He looked at me very gravely, and put his arms around my neck. I felt his heart beating like the heart of a dying bird, shot with someone's rifle . . ."},{"p":"\"I am glad that you have found what was the matter with your engine,\" he said. \"Now you can go back home--\""},{"p":"\"How do you know about that?\""},{"p":"I was just coming to tell him that my work had been successful, beyond anything that I had dared to hope."},{"p":"He made no answer to my question, but he added:"},{"p":"\"I, too, am going back home today . . .\""},{"p":"Then, sadly--"},{"p":"\"It is much farther . . . It is much more difficult . . .\""},{"p":"I realized clearly that something extraordinary was happening. I was holding him close in my arms as if he were a little child; and yet it seemed to me that he was rushing headlong toward an abyss from which I could do nothing to restrain him . . ."},{"p":"His look was very serious, like some one lost far away."},{"p":"\"I have your sheep. And I have the sheep's box. And I have the muzzle . . .\""},{"p":"And he gave me a sad smile."},{"p":"I waited a long time. I could see that he was reviving little by little."},{"p":"\"Dear little man,\" I said to him, \"you are afraid . . .\""},{"p":"He was afraid, there was no doubt about that. But he laughed lightly."},{"p":"\"I shall be much more afraid this evening . . .\""},{"i":"img/39.webp"},{"p":"Once again I felt myself frozen by the sense of something irreparable. And I knew that I could not bear the thought of never hearing that laughter any more. For me, it was like a spring of fresh water in the desert."},{"p":"\"Little man,\" I said, \"I want to hear you laugh again.\""},{"p":"But he said to me:"},{"p":"\"Tonight, it will be a year . . . My star, then, can be found right above the place where I came to the Earth, a year ago . . .\""},{"p":"\"Little man,\" I said, \"tell me that it is only a bad dream--this affair of the snake, and the meeting-place, and the star . . .\""},{"p":"But he did not answer my plea. He said to me, instead:"},{"p":"\"The thing that is important is the thing that is not seen . . .\""},{"p":"\"Yes, I know . . .\""},{"p":"\"It is just as it is with the flower. If you love a flower that lives on a star, it is sweet to look at the sky at night. All the stars are a-bloom with flowers . . .\""},{"p":"\"Yes, I know . . .\""},{"p":"\"It is just as it is with the water. Because of the pulley, and the rope, what you gave me to drink was like music. You remember--how good it was.\""},{"p":"\"Yes, I know . . .\""},{"p":"\"And at night you will look up at the stars. Where I live everything is so small that I cannot show you where my star is to be found. It is better, like that. My star will just be one of the stars, for you. And so you will love to watch all the stars in the heavens . . . they will all be your friends. And, besides, I am going to make you a present . . .\""},{"p":"He laughed again."},{"p":"\"Ah, little prince, dear little prince! I love to hear that laughter!\""},{"p":"\"That is my present. Just that. It will be as it was when we drank the water . . .\""},{"p":"\"What are you trying to say?\""},{"p":"\"All men have the stars,\" he answered, \"but they are not the same things for different people. For some, who are travelers, the stars are guides. For others they are no more than little lights in the sky. For others, who are scholars, they are problems. For my businessman they were wealth. But all these stars are silent. You--you alone--will have the stars as no one else has them--\""},{"p":"\"What are you trying to say?\""},{"p":"\"In one of the stars I shall be living. In one of them I shall be laughing. And so it will be as if all the stars were laughing, when you look at the sky at night . . . You--only you--will have stars that can laugh!\""},{"p":"And he laughed again."},{"i":"img/40.webp"},{"p":"\"And when your sorrow is comforted (time soothes all sorrows) you will be content that you have known me. You will always be my friend. You will want to laugh with me. And you will sometimes open your window, so, for that pleasure . . . And your friends will be properly astonished to see you laughing as you look up at the sky! Then you will say to them, 'Yes, the stars always make me laugh!' And they will think you are crazy. It will be a very shabby trick that I shall have played on you . . .\""},{"p":"And he laughed again."},{"p":"\"It will be as if, in place of the stars, I had given you a great number of little bells that knew how to laugh . . .\""},{"p":"And he laughed again. Then he quickly became serious:"},{"p":"\"Tonight--you know . . . Do not come.\""},{"p":"\"I shall not leave you,\" I said."},{"p":"\"I shall look as if I were suffering. I shall look a little as if I were dying. It is like that. Do not come to see that. It is not worth the trouble . . .\""},{"p":"\"I shall not leave you.\""},{"p":"But he was worried."},{"p":"\"I tell you--it is also because of the snake. He must not bite you. Snakes--they are malicious creatures. This one might bite you just for fun . . .\""},{"p":"\"I shall not leave you.\""},{"p":"But a thought came to reassure him:"},{"p":"\"It is true that they have no more poison for a second bite.\""},{"i":"img/41.webp"},{"p":"That night I did not see him set out on his way. He got away from me without making a sound. When I succeeded in catching up with him he was walking along with a quick and resolute step. He said to me merely:"},{"p":"\"Ah! You are there . . .\""},{"p":"And he took me by the hand. But he was still worrying."},{"p":"\"It was wrong of you to come. You will suffer. I shall look as if I were dead; and that will not be true . . .\""},{"p":"I said nothing."},{"p":"\"You understand . . . it is too far. I cannot carry this body with me. It is too heavy.\""},{"p":"I said nothing."},{"p":"\"But it will be like an old abandoned shell. There is nothing sad about old shells . . .\""},{"p":"I said nothing."},{"p":"He was a little discouraged. But he made one more effort:"},{"p":"\"You know, it will be very nice. I, too, shall look at the stars. All the stars will be wells with a rusty pulley. All the stars will pour out fresh water for me to drink . . .\""},{"p":"I said nothing."},{"p":"\"That will be so amusing! You will have five hundred million little bells, and I shall have five hundred million springs of fresh water . . .\""},{"p":"And he too said nothing more, becuase he was crying . . ."},{"p":"\"Here it is. Let me go on by myself.\""},{"p":"And he sat down, because he was afraid. Then he said, again:"},{"p":"\"You know--my flower . . . I am responsible for her. And she is so weak! She is so naďve! She has four thorns, of no use at all, to protect herself against all the world . . .\""},{"p":"I too sat down, because I was not able to stand up any longer."},{"p":"\"There now--that is all . . .\""},{"p":"He still hesitated a little; then he got up. He took one step. I could not move."},{"p":"There was nothing but a flash of yellow close to his ankle. He remained motionless for an instant. He did not cry out. He fell as gently as a tree falls. There was not even any sound, because of the sand."},{"i":"img/42.webp"}]},{"n":27,"items":[{"p":"And now six years have already gone by . . . I have never yet told this story. The companions who met me on my return were well content to see me alive. I was sad, but I told them: \"I am tired.\""},{"p":"Now my sorrow is comforted a little. That is to say--not entirely. But I know that he did go back to his planet, because I did not find his body at daybreak. It was not such a heavy body . . . and at night I love to listen to the stars. It is like five hundred million little bells . . ."},{"p":"But there is one extraordinary thing . . . when I drew the muzzle for the little prince, I forgot to add the leather strap to it. He will never have been able to fasten it on his sheep. So now I keep wondering: what is happening on his planet? Perhaps the sheep has eaten the flower . . ."},{"p":"At one time I say to myself: \"Surely not! The little prince shuts his flower under her glass globe every night, and he watches over his sheep very carefully . . .\" Then I am happy. And there is sweetness in the laughter of all the stars."},{"p":"But at another time I say to myself: \"At some moment or other one is absent-minded, and that is enough! On some one evening he forgot the glass globe, or the sheep got out, without making any noise, in the night . . .\" And then the little bells are changed to tears . . ."},{"p":"Here, then, is a great mystery. For you who also love the little prince, and for me, nothing in the universe can be the same if somewhere, we do not know where, a sheep that we never saw has--yes or no?--eaten a rose . . ."},{"p":"Look up at the sky. Ask yourselves: is it yes or no? Has the sheep eaten the flower? And you will see how everything changes . . ."},{"p":"And no grown-up will ever understand that this is a matter of so much importance!"},{"i":"img/43.webp"},{"p":"This is, to me, the loveliest and saddest landscape in the world. It is the same as that on the preceding page, but I have drawn it again to impress it on your memory. It is here that the little prince appeared on Earth, and disappeared."},{"p":"Look at it carefully so that you will be sure to recognize it in case you travel some day to the African desert. And, if you should come upon this spot, please do not hurry on. Wait for a time, exactly under the star. Then, if a little man appears who laughs, who has golden hair and who refuses to answer questions, you will know who he is. If this should happen, please comfort me. Send me word that he has come back."}]}],"dict":{"abandoned":"adj. 被抛弃的；废弃的，被丢弃的；放纵的，不羁的；放弃的，不再考虑的; v. 抛弃，遗弃；离弃，...","a":"art. 一；任一；每一","abashed":"adj. 感到窘迫、羞愧或不安的，尴尬的; v. abash 的过去式和过去分词","a-bloom":"豆蔻年华","able":"adj. 能够，有能力的；聪明能干的，精通（某事）的; 【名】 （Able）（英）埃布尔，（伊朗）阿...","about--about--that":"","abodes":"n．住所，居住地：一个人或一群人居住的地方。","about":"adv. 大约；几乎；到处，各处；无所事事；周围，在……附近；无序地，凌乱地；朝相反方向; prep...","above":"prep. （数量或度量）在……以上，超过；在（或向）……上面；（级别或地位上）高于； （重要性、质...","abruptly":"adv. 突然地；唐突地；陡然","abruptly--as":"突加应力的，突加应力","absence":"n. 缺席，缺勤，不在；缺乏，没有；缺席期间，休假期间；不注意","abyss":"n. 危险（可怕）的局面，绝境；深渊，深不可测的地方；（人与人之间的）巨大差异，鸿沟；（地狱中的）无...","absolute":"n. （数学）绝对值：一个实数的非负值，或一个复数的实部和虚部平方和的正平方根。","absurd":"adj. 愚蠢的，荒谬的；滑稽可笑的；荒诞派的; n. 荒诞，荒诞的事物 （the absurd）","absent-minded":"adj. 心不在焉的，健忘的，出神的; n. absent-minded professor：心不在...","accident":"n. 交通事故，车祸；（不幸的）意外遭遇，不测事件；意外，偶然的事；运气，机遇；大便（或小便）失禁；...","accepted":"adj. 公认的，为公众所接受的; v. 接受；相信，认为……正确；同意（accept 的过去式和过...","acclaim":"v. 赞扬，称赞，为……喝彩; n. 赞扬，称誉，高度评价","according":"prep. 按照，根据，依照（according to，后接名词或名词短语）；据……所说（accor...","accurate":"adj. 准确的，精确的；（工具，方法）精密的；正确无误的；（武器、投掷）精准的","account":"n. 账户，户头；客户，老主顾；网络账号；描述，报道；账目；账单；赊购账，赊购；理由，解释；重要性；...","acquaintance":"n. 相识的人，泛泛之交；认识，相识；所知，了解","achievement":"n. 成绩，成就；完成，实现；（纹章）纹章牌","acquainted":"adj. 相识的，认识的；<正式>熟悉的，了解的; v. 使熟悉，使了解（acquaint 的过去分...","across":"adv. 从一边到另一边；在……对面；朝，向；宽；横向字谜答案; prep. 从一边到另一边；横过，...","actions":"n. 行动，行为（action 的复数）；动作，活动；（法律）诉讼","act const KEY_SEEN='lp_seen_v1', KEY_STAR='lp_star_v1', KEY_CH='lp_ch_v1';

let starred = new Set(JSON.parse(localStorage.getItem(KEY_STAR)||'[]'));
const DICT = DATA.dict, CH = DATA.chapters;
const book=document.getElementById('book'), sel=document.getElementById('sel');

/* ---------- 主题：paper 护眼米黄 / white 纸白 / night 夜间 ---------- */
const THEMES=['paper','white','night'];
function applyTheme(t){
  if(t==='paper') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('lp_theme_v1',t);
  const m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', t==='night'?'#191714':t==='white'?'#FAF8F3':'#F2EADC');
  const b=document.getElementById('th');
  if(b) b.textContent = t==='night'?'🌙':t==='white'?'☀️':'🍂';
}
let theme=localStorage.getItem('lp_theme_v1')||'paper';
applyTheme(theme);
document.addEventListener('DOMContentLoaded',()=>applyTheme(theme));

/* ---------- 发音：有道在线真人音优先，离线/失败退回系统语音 ---------- */
const ACC_KEY='lp_acc_v1';
let accent=localStorage.getItem(ACC_KEY)||'2';   // 2=美音 1=英音
const audio=new Audio(); audio.preload='auto';
let pending='', ttsOK=!!window.speechSynthesis;
try{audio.volume=1;}catch(e){}

function cleanWord(w){ return String(w||'').replace(/[^A-Za-z']/g,''); }
function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs=speechSynthesis.getVoices()||[];
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Natural|Zira|Aria|Samantha|Jenny|Guy/i.test(v.name))
     || vs.find(v=>/en[-_]GB/i.test(v.lang)&&/Natural|Hazel|George|Ryan/i.test(v.name))
     || vs.find(v=>/^en/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function ttsSpeak(text){
  if(!window.speechSynthesis){ return false; }
  const isEn=/^[\x20-\x7E]+$/.test(String(text).trim());
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=isEn?'en-US':'zh-CN'; if(voice&&isEn)u.voice=voice;
  u.rate=isEn?0.88:1; u.pitch=1;
  setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} },70);   // cancel 后立刻 speak 会被吞掉
  return true;
}
function fallbackTTS(){
  const w=pending; pending='';
  if(!w) return;
  if(!ttsSpeak(w)){ /* 浏览器连系统语音都没有，只能提示一次 */
    if(!window.__noTTS){ window.__noTTS=1; alert('这个浏览器没有语音引擎，单词发音请联网后重试（走在线真人音）。'); }
  }
}
function say(text){
  const w=cleanWord(text); if(!w) return;
  pending=w;
  try{ audio.pause(); audio.currentTime=0; }catch(e){}
  audio.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type='+accent;
  const p=audio.play();
  if(p&&p.catch) p.catch(()=>fallbackTTS());
  setTimeout(()=>{ if(pending===w) fallbackTTS(); },2600);   // 2.6s 还没出声就当失败
}
audio.addEventListener('playing',()=>{ pending=''; });
audio.addEventListener('error',()=>{ if(pending) fallbackTTS(); });

function accLabel(){ const a=document.querySelector('#pop .ac'); if(a) a.textContent=accent==='2'?'美':'英'; }
function toggleAcc(){ accent=accent==='2'?'1':'2'; localStorage.setItem(ACC_KEY,accent); accLabel(); }


function addZh(p,t){
  const d=document.createElement('div'); d.className='zh'; d.textContent='【机翻参考】'+t; p.after(d);
}
function translatePara(p,text,btn){
  const box=p.nextElementSibling;
  if(box&&box.classList.contains('zh')){ box.remove(); btn.textContent='译'; return; }
  let cache={}; try{ cache=JSON.parse(localStorage.getItem('lp_mt_v1')||'{}'); }catch(e){}
  if(cache[text]){ addZh(p,cache[text]); btn.textContent='中'; return; }
  btn.textContent='…';
  const chunk=text.length>450?text.slice(0,450):text;
  fetch('https://api.mymemory.translated.net/get?langpair=en|zh-CN&q='+encodeURIComponent(chunk))
    .then(r=>r.json()).then(d=>{
      const t=((d.responseData&&d.responseData.translatedText)||'').trim();
      if(!t) throw new Error('empty');
      cache[text]=t; localStorage.setItem('lp_mt_v1',JSON.stringify(cache));
      addZh(p,t); btn.textContent='中';
    }).catch(()=>{ btn.textContent='译'; alert('翻译接口没响应，确认联网后再点一次'); });
}
const WORD_RE=/[A-Za-z]+(?:'[A-Za-z]+)?/g;
function renderPara(text){
  const p=document.createElement('p'); p.className='para';
  let last=0,m;
  while((m=WORD_RE.exec(text))!==null){
    if(m.index>last) p.appendChild(document.createTextNode(text.slice(last,m.index)));
    const span=document.createElement('span'); span.className='w';
    span.textContent=m[0]; const low=m[0].toLowerCase();
    span.dataset.w=low;
    if(seen.has(low)) span.classList.add('seen');
    if(starred.has(low)) span.classList.add('star');
    p.appendChild(span); last=m.index+m[0].length;
  }
  if(last<text.length) p.appendChild(document.createTextNode(text.slice(last)));
  const rd=document.createElement('span'); rd.className='act rd'; rd.textContent='🔊'; rd.title='朗读这一段';
  rd.onclick=e=>{e.stopPropagation();if(!ttsSpeak(text)) alert('这个浏览器没有语音引擎，整段朗读不可用；单词发音仍可点。');};
  p.appendChild(rd);
  const tr=document.createElement('span'); tr.className='act tr'; tr.textContent='译'; tr.title='机器翻译这一段（联网）';
  tr.onclick=e=>{e.stopPropagation();translatePara(p,text,tr);};
  p.appendChild(tr);
  return p;
}

function renderChapter(n, scroll){
  const c=CH.find(x=>x.n===n)||CH[0];
  book.innerHTML='';
  const h=document.createElement('h2'); h.className='ch'; h.textContent='Chapter '+c.n;
  book.appendChild(h);
  c.items.forEach(it=>{
    if(it.p!==undefined){ book.appendChild(renderPara(it.p)); }
    else { const img=document.createElement('img'); img.className='plate'; img.loading='lazy'; img.decoding='async'; img.src=it.i;
           img.onclick=()=>{mask.style.display='flex';mask.querySelector('img').src=it.i;}; book.appendChild(img); }
  });
  sel.value=String(c.n);
  localStorage.setItem(KEY_CH,String(c.n));
  const nxt=document.createElement('button'); nxt.className='navnext';
  nxt.textContent = c.n<27 ? '下一章 ›' : '回到第一章 ›';
  nxt.onclick=()=>renderChapter(c.n<27?c.n+1:1,true);
  book.appendChild(nxt);
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
  document.title='Ch.'+c.n+' · The Little Prince';
}

CH.forEach(c=>{ const o=document.createElement('option'); o.value=c.n; o.textContent='Ch.'+c.n; sel.appendChild(o); });

function showPop(span){
  curWord=span.dataset.w;
  const df=DICT[curWord]||'';
  pop.querySelector('.hw').textContent=span.textContent;
  const d=pop.querySelector('.df');
  if(df){ d.className='df'; d.textContent=df; } else { d.className='miss'; d.textContent='未收录（可能是人名/地名）'; }
  pop.querySelector('.fav').textContent=starred.has(curWord)?'★':'☆';
  pop.style.display='block';
  const r=span.getBoundingClientRect();
  const w=pop.offsetWidth, h=pop.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.bottom+10;
  x=Math.max(10,Math.min(x,innerWidth-w-10));
  if(y+h>innerHeight-10) y=Math.max(56, r.top-h-10);
  pop.style.left=x+'px'; pop.style.top=y+'px';
  accLabel();
  if(curWord) say(curWord);
  if(!seen.has(curWord)){ seen.add(curWord); localStorage.setItem(KEY_SEEN,JSON.stringify([...seen]));
    document.querySelectorAll('.w').forEach(e=>{if(e.dataset.w===curWord)e.classList.add('seen');}); }
}
book.addEventListener('click',e=>{
  const t=e.target;
  if(t.classList.contains('w')){ showPop(t); }
  else if(!pop.contains(t)) pop.style.display='none';
});
pop.querySelector('.cls').onclick=()=>pop.style.display='none';
pop.querySelector('.say').onclick=()=>say(curWord);
pop.querySelector('.ac').onclick=()=>{ toggleAcc(); say(curWord); };
pop.querySelector('.fav').onclick=()=>{
  const b=pop.querySelector('.fav');
  if(starred.has(curWord)){ starred.delete(curWord); b.textContent='☆'; }
  else { starred.add(curWord); b.textContent='★'; }
  localStorage.setItem(KEY_STAR,JSON.stringify([...starred]));
  document.querySelectorAll('.w').forEach(e=>{ if(e.dataset.w===curWord) e.classList.toggle('star',starred.has(curWord)); });
  drawList();
};
document.addEventListener('click',e=>{ if(!pop.contains(e.target)&&!e.target.classList.contains('w')) pop.style.display='none'; });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const n=+sel.value;
  if(e.key==='ArrowRight'&&n<27) renderChapter(n+1,true);
  if(e.key==='ArrowLeft'&&n>1) renderChapter(n-1,true);
  if(e.key==='Escape'){pop.style.display='none';drawer.classList.remove('open');mask.style.display='none';}
});

function drawList(){
  const l=document.getElementById('list'); l.innerHTML='';
  const arr=[...starred].sort();
  document.getElementById('cnt').textContent='('+arr.length+')';
  if(!arr.length){ l.innerHTML='<div style="color:#8b939f">还没有收藏。点单词后按 ☆ 加入。</div>'; return; }
  arr.forEach(w=>{
    const d=document.createElement('div'); d.className='it';
    const b=document.createElement('b'); b.textContent=w;
    const sp=document.createElement('i'); sp.className='spk'; sp.textContent='🔊'; sp.title='朗读';
    sp.onclick=()=>say(w);
    const s=document.createElement('span'); s.textContent='  '+ (DICT[w]||'未收录').replace(/</g,'').slice(0,90);
    d.appendChild(b); d.appendChild(sp); d.appendChild(s);
    l.appendChild(d);
  });
}
document.getElementById('th').onclick=()=>{ theme=THEMES[(THEMES.indexOf(theme)+1)%3]; applyTheme(theme); };
document.getElementById('star').onclick=()=>{drawList();drawer.classList.toggle('open');};
document.getElementById('clear').onclick=()=>{ if(confirm('清空生词本？')){starred.clear();localStorage.setItem(KEY_STAR,'[]');
  document.querySelectorAll('.w.star').forEach(e=>e.classList.remove('star'));drawList();} };
document.getElementById('copy').onclick=()=>{
  const t=[...starred].sort().map(w=>w+'\t'+(DICT[w]||'')).join('\n');
  navigator.clipboard.writeText(t).then(()=>alert('已复制 '+starred.size+' 个单词'));
};
document.getElementById('sel').onchange=e=>renderChapter(+e.target.value,true);
document.getElementById('prev').onclick=()=>{const n=+sel.value;if(n>1)renderChapter(n-1,true);};
document.getElementById('next').onclick=()=>{const n=+sel.value;if(n<27)renderChapter(n+1,true);};
document.getElementById('fl').onclick=()=>{fontSize=Math.min(26,fontSize+1);document.body.style.fontSize=fontSize+'px';};
document.getElementById('fs').onclick=()=>{fontSize=Math.max(14,fontSize-1);document.body.style.fontSize=fontSize+'px';};
mask.onclick=()=>mask.style.display='none';
let lastY=0;
addEventListener('scroll',()=>{
  const y=scrollY, b=document.getElementById('bar');
  b.style.transform=(y>150&&y>lastY)?'translateY(-100%)':'translateY(0)';
  lastY=y;
},{passive:true});
setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.display='none';},7000);

renderChapter(+(localStorage.getItem(KEY_CH)||1),false);
drawList();
</script>
</body>
</html>
